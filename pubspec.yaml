name: tokkun_kyogikaruta
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.12.0+13

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  hooks_riverpod: ^2.5.0     # ← ランタイムで使うので dependencies に置く
  flutter_hooks: ^0.21.4       # ← アニメーション制御に使う
  go_router: ^13.2.1
  google_mobile_ads: ^9.2.0
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6   # ← アプリ本体で使うので dependencies に置く
  auto_size_text: ^3.0.0       # ← 同上

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3           # ← タイマーのテスト用（flutter_test に同梱の版。新規の取得なし）
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  # シンプルに1枚から作る場合（両OS共通の元画像）
  image_path: assets/icons/app_icon_with_card.png

  # ← Androidのアダプティブアイコンをちゃんと使いたい場合は下の2行を使う
  # adaptive_icon_background: assets/icons/bg.png # または "#EFE6D5" など色コード
  # adaptive_icon_foreground: assets/icons/fg.png #（前景。後で札を足すときはここを差し替え）

  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/gallery/
    - assets/audio/